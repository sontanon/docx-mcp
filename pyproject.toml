[project]
name = "docx-mcp"
version = "0.1.0"
description = "Legal document redlining engine: apply AI-generated changes as professional tracked changes in .docx files"
requires-python = ">= 3.14"
dependencies = [
    "lxml>=6.0",
    "diff-match-patch>=20230430",
    "pydantic>=2.0",
    "defusedxml>=0.7",
    "python-docx>=1.1",
    "fastmcp>=3.0,<4",
]

[project.optional-dependencies]
corpus = [
    "datasets>=4.8.5",
]

[project.scripts]
docx-mcp = "docx_mcp.cli:main"
docx-mcp-server = "docx_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docx_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.analysis]
# lxml is a C-extension without type stubs; diff_match_patch and python-docx
# also lack stubs.  Suppress unresolved-import for these known packages.
allowed-unresolved-imports = ["lxml.**", "diff_match_patch.**", "docx.**", "fastmcp.**"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "ANN",    # annotations
    "RUF",    # ruff-specific
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any) are disallowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]  # don't require annotations in tests
